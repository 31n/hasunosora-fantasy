name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Install dependencies
        run: |
          cd backend
          npm install
          pip install -r lambda/requirements.txt

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify setup
        run: |
          echo "=== AWS Identity ==="
          aws sts get-caller-identity
          echo ""
          echo "=== Backend directory ==="
          ls -la backend/
          echo ""
          echo "=== serverless.yml ==="
          head -10 backend/serverless.yml

      - name: Deploy to AWS
        run: |
          cd backend
          serverless deploy --stage prod --verbose
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DYNAMODB_TABLE_PREFIX: ${{ secrets.DYNAMODB_TABLE_PREFIX }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION: ${{ secrets.AWS_REGION }}
          QUIZ_COOLDOWN_MINUTES: ${{ secrets.QUIZ_COOLDOWN_MINUTES }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Get deployment info
        run: |
          cd backend
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          serverless info --stage prod >> $GITHUB_STEP_SUMMARY
          
          API_URL=$(serverless info --stage prod | grep "ANY" | awk '{print $3}' | sed 's/{proxy+}//' | head -1)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** \`${API_URL}\`" >> $GITHUB_STEP_SUMMARY

      - name: Configure S3 bucket
        continue-on-error: true
        run: |
          aws s3api put-public-access-block \
            --bucket ${{ secrets.S3_BUCKET_NAME }} \
            --public-access-block-configuration \
            "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"