name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Serverless v3 は .env を読まないので、管理パスワードは環境変数で渡す。
    # serverless.yml を読むステップ（deploy・info）すべてで必要。
    # テーブル名・バケット名は serverless.yml の既定値のまま（変えるとリソースが作り直される）
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Serverless Framework は backend/package-lock.json で固定したもの（v3）を使う
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r lambda/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Lambda
        working-directory: backend
        run: npx serverless deploy --stage prod --verbose

      - name: Get deployment info
        working-directory: backend
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### API Information" >> $GITHUB_STEP_SUMMARY
          npx serverless info --stage prod >> $GITHUB_STEP_SUMMARY

      - name: Configure S3 bucket for public access
        continue-on-error: true
        run: |
          echo "Configuring S3 bucket..."
          
          aws s3api put-public-access-block \
            --bucket ${{ secrets.S3_BUCKET_NAME }} \
            --public-access-block-configuration \
            "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"
          
          cat > /tmp/bucket-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadGetObject",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::${{ secrets.S3_BUCKET_NAME }}/*"
              }
            ]
          }
          EOF
          
          aws s3api put-bucket-policy \
            --bucket ${{ secrets.S3_BUCKET_NAME }} \
            --policy file:///tmp/bucket-policy.json
          
          echo "✅ S3 configuration complete"

      - name: Test API endpoint
        continue-on-error: true
        run: |
          echo "Testing API endpoint..."
          API_URL=$(cd backend && npx serverless info --stage prod | grep "ANY" | awk '{print $3}' | sed 's/{proxy+}//' | head -1)
          echo "API URL: ${API_URL}"
          echo "### 📡 API Endpoint" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # マスターバージョンAPIをテスト
          curl -s -f "${API_URL}master/version" && echo "✅ API is working!" || echo "⚠️ API test failed (normal on first deploy)"