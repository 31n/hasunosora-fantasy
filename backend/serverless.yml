service: hasu-fantasy-api

provider:
  name: aws
  runtime: python3.11
  region: ${env:AWS_REGION, 'ap-northeast-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    DYNAMODB_TABLE_PREFIX: ${env:DYNAMODB_TABLE_PREFIX, 'hasu-fantasy-'}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME, 'hasu-fantasy-images'}
    S3_REGION: ${env:S3_REGION, 'ap-northeast-1'}
    CHECKIN_SCORE: ${env:CHECKIN_SCORE, '10'}
    CHECKIN_COOLDOWN_MINUTES: ${env:CHECKIN_COOLDOWN_MINUTES, '5'}
    ADMIN_PASSWORD: ${env:ADMIN_PASSWORD, 'change_me'}
  apiGateway:
    binaryMediaTypes:
      - 'multipart/form-data'
      - 'image/jpeg'
      - 'image/png'
      - 'image/webp'
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_PREFIX}*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - "arn:aws:s3:::${self:provider.environment.S3_BUCKET_NAME}/*"

package:
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.venv/**'
    - '!venv/**'
    - 'lambda/**'

functions:
  api:
    handler: handler.handler
    events:
      # ユーザー関連
      - http:
          path: /users/create
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
      - http:
          path: /users/login
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
      - http:
          path: /users/{user_id}/nickname
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
      - http:
          path: /users/{user_id}/area
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
      - http:
          path: /users/{user_id}/history
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
      - http:
          path: /users/{user_id}/unlock-area
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
      
      # マスタ関連
      - http:
          path: /master/version
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
            allowCredentials: false
      - http:
          path: /master/data
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
            allowCredentials: false
      - http:
          path: /master/spots
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
            allowCredentials: false
      
      # チェックイン・クイズ
      - http:
          path: /checkins
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
      - http:
          path: /quiz/answer
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
      - http:
          path: /quiz/challenge
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false
      - http:
          path: /quiz/cooldown/{user_id}/{spot_id}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
            allowCredentials: false
      
      # 管理画面
      - http:
          path: /admin/login
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/areas
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/areas
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/areas/{area_id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/areas/{area_id}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/spots
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/spots
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/spots/{spot_id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/spots/{spot_id}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/images/upload
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false

      # クイズタイプ (公開)
      - http:
          path: /quiz-types
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
            allowCredentials: false

      # クイズタイプ (管理)
      - http:
          path: /admin/quiz-types
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/quiz-types
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/quiz-types/{quiz_type_id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/quiz-types/{quiz_type_id}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false

      # ユーザークイズタイプ選択
      - http:
          path: /users/{user_id}/quiz-type
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: false

      # お知らせ（公開）
      - http:
          path: /announcements
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
            allowCredentials: false

      # お知らせ（管理）
      - http:
          path: /admin/announcements
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/announcements
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/announcements/{announcement_id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/announcements/{announcement_id}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false
      - http:
          path: /admin/stats
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - x-admin-password
            allowCredentials: false

resources:
  Resources:
    # DynamoDB Tables
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}users
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    
    SpotsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}spots
        AttributeDefinitions:
          - AttributeName: spot_id
            AttributeType: S
        KeySchema:
          - AttributeName: spot_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    
    CheckInsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}checkins
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: spot_id_timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
          - AttributeName: spot_id_timestamp
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
    
    CooldownsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}cooldowns
        AttributeDefinitions:
          - AttributeName: user_spot_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_spot_id
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        BillingMode: PAY_PER_REQUEST
    
    MasterVersionTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}master_version
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    
    AreasTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}areas
        AttributeDefinitions:
          - AttributeName: area_id
            AttributeType: S
        KeySchema:
          - AttributeName: area_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    QuizTypesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}quiz_types
        AttributeDefinitions:
          - AttributeName: quiz_type_id
            AttributeType: S
        KeySchema:
          - AttributeName: quiz_type_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    AnnouncementsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}announcements
        AttributeDefinitions:
          - AttributeName: announcement_id
            AttributeType: S
        KeySchema:
          - AttributeName: announcement_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # S3 Bucket
    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.S3_BUCKET_NAME}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
              AllowedHeaders:
                - '*'
    
    # S3 Bucket Policy for public read access
    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action:
                - 's3:GetObject'
              Resource:
                - 'arn:aws:s3:::${self:provider.environment.S3_BUCKET_NAME}/*'

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    layer: false
    zip: true
    slim: true
    strip: false
    pythonBin: python3
    fileName: lambda/requirements.txt
    useDownloadCache: false
    useStaticCache: false