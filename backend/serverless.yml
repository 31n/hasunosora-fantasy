service: hasu-fantasy-api

provider:
  name: aws
  runtime: python3.11
  region: ${env:AWS_REGION, 'ap-northeast-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    DYNAMODB_TABLE_PREFIX: ${env:DYNAMODB_TABLE_PREFIX, 'hasu-fantasy-'}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME, 'hasu-fantasy-images'}
    S3_REGION: ${env:S3_REGION, 'ap-northeast-1'}
    QUIZ_COOLDOWN_MINUTES: ${env:QUIZ_COOLDOWN_MINUTES, '30'}
    ADMIN_PASSWORD: ${env:ADMIN_PASSWORD, 'change_me'}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_PREFIX}*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - "arn:aws:s3:::${self:provider.environment.S3_BUCKET_NAME}/*"

package:
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.venv/**'
    - '!venv/**'
    - 'lambda/**'

functions:
  api:
    handler: handler.handler
    events:
      # ユーザー関連
      - http:
          path: /users/create
          method: post
          cors: true
      - http:
          path: /users/login
          method: post
          cors: true
      - http:
          path: /users/{user_id}/nickname
          method: put
          cors: true
      - http:
          path: /users/{user_id}/history
          method: get
          cors: true
      
      # マスタ関連
      - http:
          path: /master/version
          method: get
          cors: true
      - http:
          path: /master/spots
          method: get
          cors: true
      
      # チェックイン・クイズ
      - http:
          path: /checkins
          method: post
          cors: true
      - http:
          path: /quiz/answer
          method: post
          cors: true
      - http:
          path: /quiz/cooldown/{user_id}/{spot_id}
          method: get
          cors: true
      
      # 管理画面
      - http:
          path: /admin/login
          method: post
          cors: true
      - http:
          path: /admin/spots
          method: get
          cors: true
      - http:
          path: /admin/spots
          method: post
          cors: true
      - http:
          path: /admin/spots/{spot_id}
          method: put
          cors: true
      - http:
          path: /admin/spots/{spot_id}
          method: delete
          cors: true
      - http:
          path: /admin/images/upload
          method: post
          cors: true

resources:
  Resources:
    # DynamoDB Tables
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}users
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    
    SpotsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}spots
        AttributeDefinitions:
          - AttributeName: spot_id
            AttributeType: S
        KeySchema:
          - AttributeName: spot_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    
    CheckInsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}checkins
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: spot_id_timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
          - AttributeName: spot_id_timestamp
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
    
    CooldownsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}cooldowns
        AttributeDefinitions:
          - AttributeName: user_spot_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_spot_id
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        BillingMode: PAY_PER_REQUEST
    
    MasterVersionTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}master_version
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    
    # S3 Bucket
    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.S3_BUCKET_NAME}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
              AllowedHeaders:
                - '*'

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    layer: false
    zip: true
    slim: true
    strip: false
    pythonBin: python3
    fileName: lambda/requirements.txt
    useDownloadCache: false
    useStaticCache: false